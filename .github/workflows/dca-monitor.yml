name: Monitorar repercussão da Defesa Civil e enviar ao Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-repercussao
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: python main.py

      - name: Salvar memória
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"

          # garante que está atualizado antes de commitar
          git pull --rebase origin "${GITHUB_REF_NAME}" || true

          git add state.json || true

          # só commita se tiver mudança
          if git diff --cached --quiet; then
            echo "Sem alterações em state.json"
            exit 0
          fi

          git commit -m "Atualizar estado do monitor"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Mostrar evento e hora
        run: |
          echo "event=${{ github.event_name }}"
          date -u
